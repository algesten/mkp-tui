[package]
name = "mkpclient-driver-link-native-std"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true

# Blocking-rustls worker for the link driver. Two threads per active
# connection: a manager/writer thread owning the command channel and
# a reader thread driving decoded frames back to the runtime. The
# rustls `ClientConnection` is shared behind a `Mutex`; the TCP
# stream is duplicated via `try_clone` so reads and writes can
# proceed independently without tokio.

[dependencies]
mkpclient-core = { workspace = true }
mkpclient-state-link = { workspace = true }
mkpclient-driver-link-core = { workspace = true }
mkproto = { workspace = true }

log = { workspace = true }
rustls = { version = "0.23", features = ["aws-lc-rs"] }
rustls-pemfile = "2"
rcgen = { version = "0.14", features = ["x509-parser"] }
sha2 = "0.10"
hex = "0.4"
