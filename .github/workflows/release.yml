name: Release

# Builds artifacts only. The private repo's make release downloads the exact
# run, adds signed macOS artifacts, and publishes the complete prerelease.
# Moving a candidate tag must never let an older CI run overwrite a release.
run-name: Linux ${{ inputs.version }} / ${{ inputs.candidate || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string embedded in the binaries'
        required: true
        default: '0.0.0-test'
      candidate:
        description: 'Unique candidate ID supplied by make release'
        required: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Resolve version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || exit 1
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # musl-tools supplies musl-gcc. rustc bundles a self-contained
      # musl for pure-Rust builds, but aws-lc-rs (via rustls) compiles
      # C, so it needs a real musl-targeting C compiler and cmake.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools cmake
          rustup target add ${{ matrix.target }}

      - name: Build
        env:
          MKP_VERSION: ${{ steps.version.outputs.version }}
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }} -p mkpclient-tui

      # Both matrix entries build natively for their runner's arch,
      # so the binary always runs here — no emulation guard needed.
      - name: Verify the binary is static and self-reporting
        env:
          EXPECTED: ${{ steps.version.outputs.version }}
        run: |
          BIN=target/${{ matrix.target }}/release/mkp
          file "$BIN"
          # A dynamically linked binary would defeat the point of musl:
          # it would stop working on older or different distros. Rust
          # musl builds land as either "statically linked" or
          # "static-pie linked" depending on the target.
          if ! file "$BIN" | grep -qE 'statically linked|static-pie linked'; then
            echo "::error::$BIN is not statically linked"
            exit 1
          fi
          ACTUAL="$("$BIN" --version | awk '{print $2}')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::mkp --version reported '$ACTUAL', expected '$EXPECTED'"
            exit 1
          fi

      - name: Package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Ships as a download; debug symbols roughly triple the size.
          strip "target/${{ matrix.target }}/release/mkp"
          NAME="mkp-$VERSION-${{ matrix.target }}.tar.gz"
          tar -czf "$NAME" -C "target/${{ matrix.target }}/release" mkp
          sha256sum "$NAME" | tee "$NAME.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.name }}
            ${{ steps.package.outputs.name }}.sha256
          if-no-files-found: error
